[package]
name = "fivem-clothing-studio"
version = "0.1.0"
description = "Professional desktop editor for FiveM clothing resources"
authors = ["FiveM Clothing Studio Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fivem_clothing_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
quick-xml = { version = "0.36", features = ["serialize"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
walkdir = "2.5"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
sha2 = "0.10"
regex = "1.11"
once_cell = "1.20"
flate2 = "1.0"
texture2ddecoder = "0.1.2"
ddsfile = "0.6.0"
image = { version = "0.25.6", default-features = false, features = ["png"] }
base64 = "0.22.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
